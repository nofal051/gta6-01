<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solmar Bay — a 2D top-down open-world crime game: steal cars, outrun the police, run ten story missions, race, deliver, and rule the city.">
<title>Solmar Bay — Open-World Crime Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  noscript p { color: #fff; font: 18px sans-serif; padding: 40px; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay: walk and drive around an open city, steal cars, dodge the police and run missions for Mara Voss and Ilsa Crane"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p>Solmar Bay needs JavaScript to run.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
